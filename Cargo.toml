[workspace]
resolver = "2"
members = ["crates/*"]
# The Tauri shell keeps its own lockfile and target directory.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Rendering tests are far too slow unoptimized.
[profile.dev.package.cardsmith-core]
opt-level = 2
[profile.test.package.cardsmith-core]
opt-level = 2
# So is filling.
[profile.dev.package.cardsmith-fill]
opt-level = 3
[profile.test.package.cardsmith-fill]
opt-level = 3
