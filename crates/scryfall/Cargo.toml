[package]
name = "cardsmith-scryfall"
description = "Scryfall client for Cardsmith: polite requests, an on-disk cache that works offline, and bulk data."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cardsmith-cards = { path = "../cards" }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = "1"
serde_json = "1"
ureq = { version = "2", features = ["native-certs"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
