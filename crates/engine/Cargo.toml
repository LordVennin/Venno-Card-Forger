[package]
name = "cardsmith-engine"
description = "The Cardsmith card engine: a template and a card in, one undoable batch of edits out."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
cardsmith-core = { path = "../core" }
cardsmith-cards = { path = "../cards" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
