[package]
name = "cardsmith"
version = "0.0.0"
description = "Layer-based editor for Magic: The Gathering proxy cards"
license = "MPL-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cardsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
cardsmith-core = { path = "../../../crates/core" }
cardsmith-cards = { path = "../../../crates/cards" }
cardsmith-scryfall = { path = "../../../crates/scryfall" }
cardsmith-fill = { path = "../../../crates/fill", features = ["onnx", "sdcpp"] }

# Filling is far too slow unoptimized, and so is decoding the art for it.
[profile.dev.package.cardsmith-fill]
opt-level = 3
[profile.dev.package.cardsmith-core]
opt-level = 2
